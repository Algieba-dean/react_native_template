coverage:
  precision: 2
  round: down
  range: '70...100'

  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 2%

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: false

ignore:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - 'src/__tests__/**'
  - 'jest.config.js'
  - 'jest.setup.ts'
  - 'metro.config.js'
  - 'babel.config.js'
