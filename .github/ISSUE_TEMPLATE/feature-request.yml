name: 💡 Feature Request
description: Propose a new feature, improvement, or architectural enhancement
labels: ['type: feature']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or improvement!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution or feature you'd like to see added.
      placeholder: Add support for...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, screenshots, design links, or references here.
    validations:
      required: false
