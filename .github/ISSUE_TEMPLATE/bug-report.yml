name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When navigating to the home screen...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'npm start'
        2. Launch iOS Simulator
        3. Switch theme to Dark mode
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Node version, React Native version, Device / Simulator model.
      placeholder: |
        - OS: macOS 14.5
        - Node: v20.x
        - React Native: 0.76.x
        - Target: iOS 17 Simulator / Pixel 7 (Android 14)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant logs, terminal output, or stack traces.
      render: shell
